[package]
name = "chimiaclaw-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "chimiaclaw_node"
path = "src/lib.rs"

[[bin]]
name = "chimiaclaw-node"
path = "src/main.rs"

[dependencies]
chimiaclaw-agent = { path = "../chimiaclaw-agent" }
chimiaclaw-artifact = { path = "../chimiaclaw-artifact" }
chimiaclaw-schema = { path = "../chimiaclaw-schema" }
chimiaclaw-skill = { path = "../chimiaclaw-skill" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
